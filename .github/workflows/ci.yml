name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m pytest -q

      - name: Build
        run: uv build

      # Both contract YAMLs are read at runtime, by load_contract() and
      # load_mirrored_tables() respectively. A wheel missing either imports
      # fine and then fails on first use, so assert both here in one loop.
      - name: Assert the contract ships inside the wheel
        run: |
          uv run python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          needed = [
              'cube_analytics/contract/cube-contract.yaml',
              'cube_analytics/contract/mirrored-tables.yaml',
          ]
          missing = [need for need in needed if need not in names]
          if missing:
              sys.exit(f'{missing} missing from {whl}\n' + '\n'.join(names))
          print(f'ok: {needed} present in {whl}')
          PY

      # release-please bumps pyproject.toml and __init__.py together on the
      # release PR; this catches the two drifting from a hand-edited one.
      - name: Assert version metadata is consistent
        run: |
          uv run python - <<'PY'
          import sys, tomllib
          import cube_analytics
          pyproject = tomllib.load(open('pyproject.toml','rb'))['project']['version']
          if pyproject != cube_analytics.__version__:
              sys.exit(f'version mismatch: pyproject={pyproject} '
                       f'__init__={cube_analytics.__version__}')
          print(f'ok: version {pyproject} consistent with __init__')
          PY
