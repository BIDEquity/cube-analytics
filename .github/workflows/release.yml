name: Release

# release-please watches Conventional Commit messages on every push to main
# and keeps a release pull request open with the next version and changelog.
# Merging that PR bumps pyproject.toml and __init__.py together, tags the
# release, and publishes a GitHub Release — nobody runs a bump command by
# hand. This workflow then builds the wheel and sdist and attaches them.
#
# Consumers install from the published asset, pinned to a tag:
#   cube-analytics @ https://github.com/BIDEquity/cube-analytics/releases/download/v1.4.0/cube_analytics-1.4.0-py3-none-any.whl

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras

      - name: Test
        run: uv run python -m pytest -q

      - name: Build
        run: uv build

      # The contract YAML is read at runtime by load_contract(). A wheel that
      # omits it imports fine and then fails on first use, so assert it here.
      - name: Assert the contract ships inside the wheel
        run: |
          uv run python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob('dist/*.whl')[0]
          need = 'cube_analytics/contract/cube-contract.yaml'
          if need not in zipfile.ZipFile(whl).namelist():
              sys.exit(f'{need} missing from {whl}')
          print(f'ok: {need} present in {whl}')
          PY

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} dist/*.whl dist/*.tar.gz
