[project]
name = "cube-analytics"
version = "1.2.0"
description = "Helper libraries for analyzing cube data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ibis-framework[duckdb,polars]>=9.0.0",
    "thefuzz>=0.22.1",
    "jaro-winkler>=2.0.3",
    "polars>=1.34.0",
    "duckdb>=1.4.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cube_analytics"]
