[project]
name = "cube-analytics"
version = "2.0.0"
description = "The cube data contract, shared by cube-pipelines and cube-command-center"
readme = "README.md"
requires-python = ">=3.11"
# The contract is a YAML file and some dataclasses. Everything that needed an
# analytics stack — Ibis, polars, duckdb, the fuzzy matchers — left in v2.0.0.
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cube_analytics"]
# the contract YAML is data the package reads at runtime, not just a doc
artifacts = ["src/cube_analytics/contract/*.yaml"]

[tool.hatch.build.targets.sdist]
include = ["src/cube_analytics", "tests", "README.md", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8.0"]
